<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — InventoryZero</title>
    <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
    <div class="auth-wrapper">
        <nav class="auth-nav">
            <span class="logo">Inventory<span>Zero</span></span>
        </nav>
        <div class="auth-card">
            <h1>Create account</h1>
            <p>Join thousands getting insane deals</p>
            <div class="role-toggle">
            </div>
            <input type="hidden" id="role" value="Buyer" />
            <div class="err-msg" id="err-msg"></div>
            <div class="field">
                <label>Full name</label>
                <input type="text" id="fullName" placeholder="John Dlamini" />
            </div>
            <div class="field">
                <label>Email address</label>
                <input type="email" id="email" placeholder="you@example.com" />
            </div>
            <div class="field">
                <label>Phone (optional)</label>
                <input type="tel" id="phone" placeholder="+27 81 234 5678" />
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="password" placeholder="Min 8 characters" />
            </div>
            <button class="btn-primary" id="register-btn">Create account</button>
            <p class="switch">Already have an account? <a href="/pages/login.html">Sign in</a></p>
            <div style="text-align:center;margin-top:1rem;">
                <p style="font-size:13px;color:#6b7280;">
                    Already have an account? <a href="/pages/login.html">Sign in</a>
                </p>
                <p style="font-size:13px;color:#6b7280;margin-top:0.5rem;">
                    Want to sell? <a href="/pages/register.html?role=Seller">Become a seller</a>
                </p>
            </div>
        </div>
    </div>
    <script src="/js/auth.js"></script>
</body>
</html>
